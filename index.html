<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contatos</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <div class="container">
    <form>
      <div class="input-nome">
        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome" maxlength="50">
      </div>

      <div class="input-numero">
        <label for="numero">Número:</label>
        <input type="text" name="numero" id="numero" placeholder="ex: 11999999999" maxlength="11">
      </div>

      <div class="btns">
        <input type="submit" value="Adicionar Contato" id="btn-add">
        <input type="submit" value="Mostrar Contatos" id="btn-mostrar">
      </div>
    </form>

    <div id="results">

    </div>
  </div>

  <script type="module" src="./js/script.js"></script>
</body>

</html>
